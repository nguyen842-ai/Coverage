<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bản đồ Việt Nam - Tối giản</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc; /* Nền tổng thể của trang web */
        }

        /* Khung chứa chia làm 2 cột bằng Flexbox */
        .dashboard-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* CỘT TRÁI: KHUNG CHỨA BẢN ĐỒ */
        #map {
            width: 65%; /* Bản đồ chiếm 65% chiều rộng bên trái */
            height: 100%;
            background-color: #ffffff !important; /* Đổi nền mặc định của bản đồ thành màu trắng tinh */
        }

        /* CỘT PHẢI: TIÊU ĐỀ VÀ BỘ LỌC */
        #sidebar-right {
            width: 35%; /* Bộ lọc chiếm 35% chiều rộng bên phải */
            background: #ffffff;
            border-left: 1px solid #e2e8f0; /* Đường kẻ phân cách mỏng */
            padding: 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 999;
        }

        #sidebar-right h1 {
            font-size: 20px;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            line-height: 1.4;
        }

        #sidebar-right p {
            font-size: 13px;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #334155;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-group select:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        #loader {
            font-size: 13px;
            color: #3b82f6;
            font-weight: 500;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        
        <div id="map"></div>

        <div id="sidebar-right">
            <h1>Bản đồ Hành chính Việt Nam</h1>
            <p>Hệ thống hiển thị ranh giới và bộ lọc dữ liệu địa lý tương tác.</p>
            
            <div class="filter-group">
                <label for="provinceSelect">Tỉnh / Thành phố</label>
                <select id="provinceSelect">
                    <option value="">-- Tất cả Tỉnh/Thành --</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="districtSelect">Quận / Huyện</label>
                <select id="districtSelect" disabled>
                    <option value="">-- Tất cả Quận/Huyện --</option>
                </select>
            </div>

            <div id="loader">Đang khởi tạo dữ liệu bản đồ...</div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Khởi tạo bản đồ (Không thêm lớp tileLayer nền)
        const map = L.map('map', { 
            attributionControl: false,
            zoomControl: true 
        }).setView([16.047, 105.804], 6);

        // Đổi nút zoom sang góc trên bên trái cho gọn
        map.zoomControl.setPosition('topleft');

        const PROP_PROVINCE = 'COUNTRY'; 
        const PROP_DISTRICT = 'NAME_1';  

        // 2. Màu sắc phối lại cho các khối ranh giới (Vì không có nền nên cần nổi bật vừa phải)
        const defaultStyle = {
            color: "#cbd5e1",       // Đường viền mảnh màu xám
            weight: 0.8,
            fillColor: "#f1f5f9",   // Màu nền các quận huyện xám trắng nhẹ
            fillOpacity: 1          // Đổ đặc màu để che phần nền trắng phía dưới
        };

        let originalGeoData = null; 
        let currentMapLayer = null; 

        const provinceSelect = document.getElementById('provinceSelect');
        const districtSelect = document.getElementById('districtSelect');
        const loader = document.getElementById('loader');

        // 3. Tải dữ liệu hình học
        fetch('gadm41_VNM_2.json')
            .then(res => res.json())
            .then(data => {
                originalGeoData = data;
                loader.style.display = 'none'; 

                // Vẽ bản đồ lần đầu
                renderMap(originalGeoData.features);
                populateProvinces(originalGeoData.features);
            })
            .catch(err => {
                loader.innerText = "Lỗi tải dữ liệu JSON.";
                console.error(err);
            });

        function renderMap(features) {
            if (currentMapLayer) {
                map.removeLayer(currentMapLayer); 
            }

            currentMapLayer = L.geoJSON({ type: "FeatureCollection", features: features }, {
                style: defaultStyle,
                onEachFeature: function(feature, layer) {
                    let prov = feature.properties[PROP_PROVINCE] || "Chưa rõ";
                    let dist = feature.properties[PROP_DISTRICT] || "Chưa rõ";
                    
                    layer.bindPopup(`
                        <strong style="font-size:14px;">${dist}</strong><br>
                        <span style="color:#64748b; font-size:12px;">Thuộc: ${prov}</span>
                    `);

                    // Hiệu ứng rê chuột vào đổi khối hình sang tone màu xanh dịu
                    layer.on({
                        mouseover: (e) => {
                            e.target.setStyle({ 
                                weight: 1.5, 
                                color: '#3b82f6', 
                                fillColor: '#e0f2fe' 
                            });
                        },
                        mouseout: (e) => { 
                            currentMapLayer.resetStyle(e.target); 
                        }
                    });
                }
            }).addTo(map);

            // Hàm tự động tính toán để thu nhỏ/phóng to bản đồ nằm vừa trọn góc khung hình bên trái
            map.fitBounds(currentMapLayer.getBounds(), {
                padding: [20, 20] // Tạo khoảng trống viền 20px để bản đồ không bị dính sát mép
            });
        }

        function populateProvinces(features) {
            const provinces = [...new Set(features.map(f => f.properties[PROP_PROVINCE]))].sort();
            provinces.forEach(prov => {
                if(prov) {
                    let opt = document.createElement('option');
                    opt.value = prov;
                    opt.textContent = prov;
                    provinceSelect.appendChild(opt);
                }
            });
        }

        // Sự kiện lọc Tỉnh
        provinceSelect.addEventListener('change', function() {
            const selectedProvince = this.value;
            districtSelect.innerHTML = '<option value="">-- Tất cả Quận/Huyện --</option>';
            
            if (!selectedProvince) {
                renderMap(originalGeoData.features);
                districtSelect.disabled = true;
                return;
            }

            const filteredFeatures = originalGeoData.features.filter(f => f.properties[PROP_PROVINCE] === selectedProvince);
            renderMap(filteredFeatures);
            
            const districts = [...new Set(filteredFeatures.map(f => f.properties[PROP_DISTRICT]))].sort();
            districts.forEach(dist => {
                if(dist) {
                    let opt = document.createElement('option');
                    opt.value = dist;
                    opt.textContent = dist;
                    districtSelect.appendChild(opt);
                }
            });
            districtSelect.disabled = false;
        });

        // Sự kiện lọc Huyện
        districtSelect.addEventListener('change', function() {
            const selectedProvince = provinceSelect.value;
            const selectedDistrict = this.value;

            if (!selectedDistrict) {
                const filteredFeatures = originalGeoData.features.filter(f => f.properties[PROP_PROVINCE] === selectedProvince);
                renderMap(filteredFeatures);
                return;
            }

            const finalFeatures = originalGeoData.features.filter(f => 
                f.properties[PROP_PROVINCE] === selectedProvince && 
                f.properties[PROP_DISTRICT] === selectedDistrict
            );
            renderMap(finalFeatures);
        });
    </script>
</body>
</html>
