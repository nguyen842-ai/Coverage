<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bản đồ Nhiệt & Biểu đồ Hỗn hợp</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
        }

        .dashboard-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Giao diện chia đôi màn hình đối xứng tuyệt đối 50% - 50% */
        #map {
            width: 50%;
            height: 100%;
            background-color: #ffffff !important;
        }

        #sidebar-right {
            width: 50%;
            background: #ffffff;
            border-left: 1px solid #cbd5e1;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 999;
        }

        h1 {
            font-size: 20px;
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .filter-group {
            flex: 1;
            margin-bottom: 12px;
        }

        .filter-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #1e293b;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: #2563eb;
            background-color: #ffffff;
        }

        .heat-config-panel {
            background: #eff6ff;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
            margin-top: 5px;
        }

        /* THƯỚC ĐO MÀU NHIỆT */
        .legend-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            margin-top: 15px;
        }
        .legend-title {
            font-size: 11px;
            font-weight: 600;
            color: #1e40af;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .legend-bar {
            display: flex;
            height: 12px;
            border-radius: 4px;
            overflow: hidden;
            background: linear-gradient(to right, #93c5fd, #60a5fa, #2563eb, #1d4ed8, #1e3a8a);
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .report-container {
            border-top: 2px solid #e2e8f0;
            padding-top: 15px;
        }

        .report-header {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 15px;
        }

        .report-header h3 {
            margin: 0 0 4px 0;
            color: #1e3a8a;
            font-size: 15px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            background: #e0f2fe;
            color: #0369a1;
            padding: 8px;
            font-weight: 600;
            border-bottom: 2px solid #bae6fd;
            text-align: left;
        }

        .data-table td {
            padding: 8px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
        }

        .data-table tr:hover {
            background: #f0f7ff;
        }

        .no-data {
            color: #94a3b8;
            text-align: center;
            padding: 30px 0;
            font-style: italic;
            font-size: 13px;
        }

        #loader {
            font-size: 13px;
            color: #2563eb;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <div id="map"></div>

        <div id="sidebar-right">
            <h1>Hệ thống Giám sát Hiệu suất</h1>
            <p class="subtitle">Bản đồ nhiệt phân tích dữ liệu kinh doanh đa chiều doanh nghiệp.</p>
            
            <div class="filter-row">
                <div class="filter-group">
                    <label for="hqSelect">HQ (Miền)</label>
                    <select id="hqSelect"><option value="">-- Tất cả HQ --</option></select>
                </div>
                <div class="filter-group">
                    <label for="areaSelect">Area (Khu vực)</label>
                    <select id="areaSelect"><option value="">-- Tất cả Area --</option></select>
                </div>
            </div>

            <div class="filter-row">
                <div class="filter-group">
                    <label for="provinceSelect">Tỉnh / Thành phố</label>
                    <select id="provinceSelect"><option value="">-- Tất cả Tỉnh/Thành thuộc DB --</option></select>
                </div>
                <div class="filter-group">
                    <label for="districtSelect">Quận / Huyện</label>
                    <select id="districtSelect" disabled><option value="">-- Chọn Quận/Huyện --</option></select>
                </div>
            </div>

            <div class="filter-group">
                <label for="catSelect">CAT (Danh mục)</label>
                <select id="catSelect"><option value="">-- Tất cả CAT --</option></select>
            </div>

            <div class="heat-config-panel">
                <div class="filter-row" style="margin-bottom: 0;">
                    <div class="filter-group" style="margin-bottom: 0;">
                        <label style="color:#1e40af;" for="dataTypeSelect">Xem Bản đồ Nhiệt theo</label>
                        <select id="dataTypeSelect" style="background:#fff;">
                            <option value="Pfm">Hiệu suất (Performance)</option>
                            <option value="actC">Số lượng (Act Count)</option>
                        </select>
                    </div>
                    <div class="filter-group" style="margin-bottom: 0;">
                        <label style="color:#1e40af;" for="monthSelect">Thời gian (Tháng)</label>
                        <select id="monthSelect" style="background:#fff;">
                            <option value="Jan">Tháng 1</option>
                            <option value="Feb">Tháng 2</option>
                            <option value="Mar">Tháng 3</option>
                            <option value="Apr">Tháng 4</option>
                            <option value="May">Tháng 5</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="legend-container">
                <div class="legend-title" id="legendTitle">Mức độ chỉ số</div>
                <div class="legend-bar"></div>
                <div class="legend-labels">
                    <span id="legendMin">Thấp</span>
                    <span>Trung bình</span>
                    <span id="legendMax">Cao</span>
                </div>
            </div>

            <div id="loader">Đang khởi tạo dữ liệu bản đồ...</div>
            <div class="report-container" id="reportContainer">
                <div class="no-data">Bấm vào một vùng bất kỳ trên bản đồ nhiệt hoặc chọn bộ lọc để xem số liệu chi tiết.</div>
            </div>
        </div>
    </div>

        }

        function getHeatColor(value, min, max) {
            if (value <= 0) return '#ffffff'; 
            if (value < min) return '#93c5fd'; 
            
            const range = max - min;
            const step = range / 5;
            
            if (value < min + step) return '#93c5fd';     
            if (value < min + step * 2) return '#60a5fa'; 
            if (value < min + step * 3) return '#2563eb'; 
            if (value < min + step * 4) return '#1d4ed8'; 
            return '#1e3a8a';                             
        }

        // Khởi động nạp dữ liệu ranh giới địa lý hành chính
        fetch('gadm41_VNM_2.json')
            .then(res => {
                if(!res.ok) throw new Error("Không tìm thấy tệp JSON ranh giới.");
                return res.json();
            })
            .then(data => {
                originalGeoData = data;
                loader.style.display = 'none'; // Tắt màn hình chờ khi tải hoàn tất thành công
                populateHQOptions();
                refreshDashboard(true); 
            })
            .catch(err => { 
                loader.innerText = "Lỗi hệ thống: Không thể tải bản đồ địa lý."; 
                console.error("Lỗi mạng:", err); 
            });

        // HỆ THỐNG BỘ LỌC LIÊN HOÀN DROPDOWN
        function populateHQOptions() {
            const hqs = [...new Set(myDatabase.map(item => item.hq).filter(Boolean))].sort();
            hqSelect.innerHTML = '<option value="">-- Tất cả HQ --</option>';
            hqs.forEach(hq => {
                let opt = document.createElement('option'); opt.value = hq; opt.textContent = hq; hqSelect.appendChild(opt);
            });
            updateAreaOptions();
        }

        function updateAreaOptions() {
            const selectedHQ = hqSelect.value;
            const filteredRecords = myDatabase.filter(item => !selectedHQ || item.hq === selectedHQ);
            const areas = [...new Set(filteredRecords.map(item => item.area).filter(Boolean))].sort();
            areaSelect.innerHTML = '<option value="">-- Tất cả Area --</option>';
            areas.forEach(area => {
                let opt = document.createElement('option'); opt.value = area; opt.textContent = area; areaSelect.appendChild(opt);
            });
            updateProvinceOptions();
        }

        function updateProvinceOptions() {
            const selectedHQ = hqSelect.value;
            const selectedArea = areaSelect.value;
            const filteredRecords = myDatabase.filter(item => 
                (!selectedHQ || item.hq === selectedHQ) && (!selectedArea || item.area === selectedArea)
            );
            const provinces = [...new Set(filteredRecords.map(item => item.prov).filter(Boolean))].sort();
            provinceSelect.innerHTML = '<option value="">-- Tất cả Tỉnh/Thành thuộc DB --</option>';
            provinces.forEach(prov => {
                let opt = document.createElement('option'); opt.value = prov; opt.textContent = prov; provinceSelect.appendChild(opt);
            });
            updateCatOptions();
        }

        function updateCatOptions() {
            const selectedHQ = hqSelect.value;
            const selectedArea = areaSelect.value;
            const selectedProv = provinceSelect.value;
            const filteredRecords = myDatabase.filter(item => 
                (!selectedHQ || item.hq === selectedHQ) && (!selectedArea || item.area === selectedArea) && (!selectedProv || item.prov === selectedProv)
            );
            const cats = [...new Set(filteredRecords.map(item => item.cat).filter(Boolean))].sort();
            catSelect.innerHTML = '<option value="">-- Tất cả CAT --</option>';
            cats.forEach(cat => {
                let opt = document.createElement('option'); opt.value = cat; opt.textContent = cat; catSelect.appendChild(opt);
            });
        }

        function getDistrictValue(prov, dist, dataKey, sCat) {
            let nProv = safeNormalizeString(prov);
            let nDist = safeNormalizeString(dist);

            let distRecords = myDatabase.filter(item => 
                safeNormalizeString(item.prov) === nProv && safeNormalizeString(item.dist) === nDist
            );
            if (distRecords.length === 0) return 0;
            if (sCat) {
                let rec = distRecords.find(item => item.cat === sCat);
                return rec ? parseNumericValue(rec[dataKey]) : 0;
            } else {
                let allRec = distRecords.find(item => safeNormalizeString(item.cat).includes('all'));
                if (allRec) return parseNumericValue(allRec[dataKey]); // FIX: Đã sửa lỗi tham chiếu allRec[allRec]
                return distRecords.reduce((sum, item) => sum + parseNumericValue(item[dataKey]), 0);
            }
        }

        function refreshDashboard(shouldFitBounds = false) {
            if (!originalGeoData) return;

            const sHQ = hqSelect.value;
            const sArea = areaSelect.value;
            const sProv = provinceSelect.value;
            const sCat = catSelect.value;
            const sDataType = dataTypeSelect.value;
            const sMonth = monthSelect.value;
            const dataKey = sDataType + sMonth;

            let minVal, maxVal;
            if (sDataType === 'Pfm') {
                minVal = 900000;          
                maxVal = 2700000000;      
            } else {
                const activeRecords = myDatabase.filter(item => (!sHQ || item.hq === sHQ) && (!sArea || item.area === sArea) && (!sProv || item.prov === sProv) && (!sCat || item.cat === sCat));
                let valuesArray = activeRecords.map(item => parseNumericValue(item[dataKey])).filter(v => v > 0);
                minVal = valuesArray.length ? Math.min(...valuesArray) : 0;
                maxVal = valuesArray.length ? Math.max(...valuesArray) : 100;
            }

            document.getElementById('legendTitle').innerText = `Mức độ: ${sDataType === 'Pfm' ? 'Hiệu suất' : 'Số lượng'} (${monthSelect.options[monthSelect.selectedIndex].text})`;
            document.getElementById('legendMin').innerText = minVal > 0 ? formatNumberDisplay(minVal, sDataType) : "Thấp";
            document.getElementById('legendMax').innerText = maxVal > 0 ? formatNumberDisplay(maxVal, sDataType) : "Cao";

            const activeRecordsForGeom = myDatabase.filter(item => (!sHQ || item.hq === sHQ) && (!sArea || item.area === sArea) && (!sProv || item.prov === sProv) && (!sCat || item.cat === sCat));
            const validProvincesInActiveRecords = [...new Set(activeRecordsForGeom.map(item => safeNormalizeString(item.prov)))];

            let visibleFeatures = originalGeoData.features.filter(f => {
                let fProv = safeNormalizeString(f.properties[PROP_PROVINCE]);
                if (sProv) return fProv === safeNormalizeString(sProv);
                if (sHQ || sArea) return validProvincesInActiveRecords.includes(fProv);
                return true; 
            });

            if (currentMapLayer) { map.removeLayer(currentMapLayer); }

            currentMapLayer = L.geoJSON({ type: "FeatureCollection", features: visibleFeatures }, {
                style: function(feature) {
                    let prov = feature.properties[PROP_PROVINCE];
                    let dist = feature.properties[PROP_DISTRICT];
                    let value = getDistrictValue(prov, dist, dataKey, sCat);
                    
                    return {
                        color: "#475569", 
                        weight: 1.1,
                        fillColor: getHeatColor(value, minVal, maxVal),
                        fillOpacity: 0.95
                    };
                },
                onEachFeature: function(feature, layer) {
                    let prov = feature.properties[PROP_PROVINCE];
                    let dist = feature.properties[PROP_DISTRICT];
                    layer.on({
                        mouseover: (e) => { e.target.setStyle({ weight: 2.5, color: '#1d4ed8' }); },
                        mouseout: (e) => { currentMapLayer.resetStyle(e.target); },
                        click: (e) => { selectDistrictProgrammatically(prov, dist); }
                    });
                }
            }).addTo(map);

            if (shouldFitBounds && visibleFeatures.length > 0) {
                map.fitBounds(currentMapLayer.getBounds(), { padding: [25, 25] });
            }
        }

        function showReport(provinceName, districtName) {
            const sCat = catSelect.value;
            let nProv = safeNormalizeString(provinceName);
            let nDist = safeNormalizeString(districtName);

            let distRecords = myDatabase.filter(item => 
                safeNormalizeString(item.prov) === nProv && safeNormalizeString(item.dist) === nDist
            );

            if (distRecords.length === 0) {
                reportContainer.innerHTML = `
                    <div class="report-header"><h3>Huyện: ${districtName}</h3><span style="font-size:12px;color:#64748b">${provinceName}</span></div>
                    <div class="no-data">⚠️ Không có dữ liệu doanh số của địa bàn này trong DB.</div>
                `;
                return;
            }

            function extractMonthVal(monthKey) {
                if (sCat) {
                    let r = distRecords.find(item => item.cat === sCat);
                    return r ? parseNumericValue(r[monthKey]) : 0;
                } else {
                    let allR = distRecords.find(item => safeNormalizeString(item.cat).includes('all'));
                    if (allR) return parseNumericValue(allR[monthKey]);
                    return distRecords.reduce((sum, item) => sum + parseNumericValue(item[monthKey]), 0);
                }
            }

            const monthsData = {
                actC: [extractMonthVal('actCJan'), extractMonthVal('actCFeb'), extractMonthVal('actCMar'), extractMonthVal('actCApr'), extractMonthVal('actCMay')],
                pfm: [extractMonthVal('PfmJan'), extractMonthVal('PfmFeb'), extractMonthVal('PfmMar'), extractMonthVal('PfmApr'), extractMonthVal('PfmMay')]
            };

            reportContainer.innerHTML = `
                <div class="report-header">
                    <h3>Huyện: ${districtName} (${provinceName})</h3>
                    <div style="font-size: 12px; color:#64748b; margin-top:4px;">
                        Miền (HQ): <b>${distRecords[0].hq || "N/A"}</b> | Khu vực (Area): <b>${distRecords[0].area || "N/A"}</b><br>
                        Danh mục (CAT): <span style="color: #1e3a8a; font-weight: bold;">${sCat || "Tất cả Danh mục"}</span>
                    </div>
                </div>
                
                <div style="margin-bottom: 25px; background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; height: 260px;">
                    <canvas id="mixedChart"></canvas>
                </div>

                <table class="data-table">
                    <thead>
                        <tr><th>Thời gian</th><th>Số lượng (ActC)</th><th style="text-align:right;">Hiệu suất (Pfm)</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Tháng 1</td><td>${formatNumberDisplay(monthsData.actC[0], 'actC')}</td><td style="text-align:right; font-weight:500;">${formatNumberDisplay(monthsData.pfm[0], 'Pfm')}</td></tr>
                        <tr><td>Tháng 2</td><td>${formatNumberDisplay(monthsData.actC[1], 'actC')}</td><td style="text-align:right; font-weight:500;">${formatNumberDisplay(monthsData.pfm[1], 'Pfm')}</td></tr>
                        <tr><td>Tháng 3</td><td>${formatNumberDisplay(monthsData.actC[2], 'actC')}</td><td style="text-align:right; font-weight:500;">${formatNumberDisplay(monthsData.pfm[2], 'Pfm')}</td></tr>
                        <tr><td>Tháng 4</td><td>${formatNumberDisplay(monthsData.actC[3], 'actC')}</td><td style="text-align:right; font-weight:500;">${formatNumberDisplay(monthsData.pfm[3], 'Pfm')}</td></tr>
                        <tr><td>Tháng 5</td><td>${formatNumberDisplay(monthsData.actC[4], 'actC')}</td><td style="text-align:right; font-weight:600; color:#1e3a8a;">${formatNumberDisplay(monthsData.pfm[4], 'Pfm')}</td></tr>
                    </tbody>
                </table>
            `;

            const ctx = document.getElementById('mixedChart').getContext('2d');
            if (myChart) { myChart.destroy(); } 

            myChart = new Chart(ctx, {
                data: {
                    labels: ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5'],
                    datasets: [
                        {
                            type: 'line',
                            label: 'Doanh số (VND)',
                            data: monthsData.pfm,
                            borderColor: '#f97316',        
                            backgroundColor: 'transparent',
                            yAxisID: 'yAxisVND',           
                            borderWidth: 3,
                            tension: 0.2,
                            order: 1                       
                        },
                        {
                            type: 'bar',
                            label: 'Số lượng KH (ActC)',
                            data: monthsData.actC,
                            backgroundColor: '#2563eb',    
                            yAxisID: 'yAxisCount',         
                            order: 2,
                            maxBarThickness: 30
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        yAxisCount: {
                            type: 'linear', position: 'left',
                            title: { display: true, text: 'Số lượng khách hàng (ActC)', color: '#475569', font: { size: 11, weight: 'bold' } }
                        },
                        yAxisVND: {
                            type: 'linear', position: 'right',
                            title: { display: true, text: 'Doanh số (VND)', color: '#f97316', font: { size: 11, weight: 'bold' } },
                            ticks: { callback: function(value) { return new Intl.NumberFormat('en-US').format(value); } },
                            grid: { drawOnChartArea: false } 
                        }
                    }
                }
            });
        }

        function selectDistrictProgrammatically(prov, dist) {
            if (safeNormalizeString(provinceSelect.value) !== safeNormalizeString(prov)) {
                provinceSelect.value = prov;
                handleProvinceChange(false); 
            }
            districtSelect.value = dist;
            refreshDashboard(false);
            showReport(prov, dist);
        }

        function handleProvinceChange(shouldAutoSelectTopDistrict = true) {
            const selectedProvince = provinceSelect.value;
            
            if (!selectedProvince) {
                districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
                districtSelect.disabled = true;
                reportContainer.innerHTML = '<div class="no-data">Bấm vào một vùng bất kỳ trên bản đồ nhiệt hoặc chọn bộ lọc để xem số liệu chi tiết.</div>';
                refreshDashboard(true);
                return;
            }

            updateCatOptions();

            const sHQ = hqSelect.value;
            const sArea = areaSelect.value;
            const sCat = catSelect.value;
            const sMonth = monthSelect.value;
            const dataKey = 'Pfm' + sMonth; 

            const filteredRecords = myDatabase.filter(item => 
                safeNormalizeString(item.prov) === safeNormalizeString(selectedProvince) &&
                (!sHQ || item.hq === sHQ) &&
                (!sArea || item.area === sArea) &&
                (!sCat || item.cat === sCat)
            );

            const districts = [...new Set(filteredRecords.map(item => item.dist).filter(Boolean))].sort();
            
            districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            districts.forEach(dist => {
                let opt = document.createElement('option'); opt.value = dist; opt.textContent = dist; districtSelect.appendChild(opt);
            });
            districtSelect.disabled = false;

            if (shouldAutoSelectTopDistrict && districts.length > 0) {
                let maxRevenue = -1;
                let topPerformingDistrict = "";

                districts.forEach(dist => {
                    let val = getDistrictValue(selectedProvince, dist, dataKey, sCat);
                    if (val > maxRevenue) {
                        maxRevenue = val;
                        topPerformingDistrict = dist;
                    }
                });

                if (topPerformingDistrict) {
                    districtSelect.value = topPerformingDistrict;
                    refreshDashboard(false); 

                    const targetFeature = originalGeoData.features.filter(f => 
                        safeNormalizeString(f.properties[PROP_PROVINCE]) === safeNormalizeString(selectedProvince) &&
                        safeNormalizeString(f.properties[PROP_DISTRICT]) === safeNormalizeString(topPerformingDistrict)
                    );
                    if (targetFeature.length > 0) {
                        map.fitBounds(L.geoJSON(targetFeature).getBounds(), { padding: [40, 40] });
                    }
                    showReport(selectedProvince, topPerformingDistrict);
                    return;
                }
            }
            refreshDashboard(true);
        }

        hqSelect.addEventListener('change', function() { updateAreaOptions(); refreshDashboard(true); });
        areaSelect.addEventListener('change', function() { updateProvinceOptions(); refreshDashboard(true); });
        provinceSelect.addEventListener('change', function() { handleProvinceChange(true); });
        
        districtSelect.addEventListener('change', function() {
            const selectedProvince = provinceSelect.value;
            const selectedDistrict = this.value;
            if (!selectedDistrict) { refreshDashboard(true); return; }
            
            const target = originalGeoData.features.filter(f => 
                safeNormalizeString(f.properties[PROP_PROVINCE]) === safeNormalizeString(selectedProvince) &&
                safeNormalizeString(f.properties[PROP_DISTRICT]) === safeNormalizeString(selectedDistrict)
            );
            if (target.length > 0) { map.fitBounds(L.geoJSON(target).getBounds(), { padding: [40, 40] }); }
            showReport(selectedProvince, selectedDistrict);
        });

        catSelect.addEventListener('change', function() { refreshDashboard(false); });
        dataTypeSelect.addEventListener('change', () => refreshDashboard(false));
        monthSelect.addEventListener('change', () => refreshDashboard(false));
    </script>
</body>
</html>
