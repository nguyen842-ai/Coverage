<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tô Màu & Đánh Dấu Bản Đồ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
        #map { width: 100%; height: 100%; background-color: #ffffff !important; }

        /* Bảng công cụ nổi */
        .toolbox {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 300px; border: 1px solid #e2e8f0;
            backdrop-filter: blur(5px);
            max-height: 90vh; overflow-y: auto;
        }
        .toolbox h2 { font-size: 16px; color: #1e3a8a; margin: 0 0 16px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;}
        
        .tool-group { margin-bottom: 16px; }
        .tool-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .tool-group select, .tool-group input[type="color"], .tool-group input[type="file"] {
            width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;
            font-size: 12px; outline: none; cursor: pointer; background: white; box-sizing: border-box;
        }
        
        #borderColorPickerGroup { margin-top: 10px; }

        /* Nút Upload Excel */
        .excel-upload-wrapper {
            background: #f1f5f9; border: 1px dashed #94a3b8; padding: 12px; border-radius: 8px; text-align: center;
        }
        .excel-upload-wrapper label { cursor: pointer; margin: 0; color: #2563eb; font-weight: bold; }
        .excel-upload-wrapper input[type="file"] { display: none; }
        .excel-note { font-size: 10px; color: #64748b; margin-top: 6px; line-height: 1.4; }

        /* Nút Xuất Ảnh */
        .export-btn {
            width: 100%; padding: 10px; background: #10b981; color: white; border: none; 
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
            transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .export-btn:hover { background: #059669; }

        /* Công tắc (Switch) */
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .toggle-row span { font-size: 12px; font-weight: 600; color: #334155; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .2s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(14px); }

        /* Custom Markers */
        .kc-pin {
            background: white; border: 2.5px solid #0047ab; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: #0047ab;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            width: 100%; height: 100%; box-sizing: border-box;
        }
        .npp-pin {
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));
            width: 100%; height: 100%;
        }
        .delete-btn {
            background: #ef4444; color: white; border: none; padding: 6px 10px; 
            border-radius: 4px; cursor: pointer; font-size: 11px; width: 100%; font-weight: bold;
            margin-top: 8px; transition: 0.2s;
        }
        .delete-btn:hover { background: #dc2626; }

        /* Nhãn bản đồ mặc định */
        .map-label {
            background: transparent !important; border: none !important; box-shadow: none !important;
            font-size: 11px !important; font-weight: bold !important; color: #1e293b !important;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Khi xuất ảnh: Phóng to chữ và ghim tự động theo tỷ lệ */
        .exporting .map-label { 
            font-size: 32px !important; 
            text-shadow: -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff, 0px 0px 12px #fff !important;
        }
        .exporting .custom-div-icon {
            width: 64px !important;
            height: 64px !important;
            margin-left: -32px !important;
            margin-top: -32px !important;
        }
        .exporting .kc-pin { 
            font-size: 26px !important; 
            border-width: 5px !important;
        }
        .exporting .npp-pin { 
            font-size: 60px !important; 
        }

        #loader { display: none; font-size: 12px; color: #ea580c; font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="toolbox">
        <h2>Công cụ Bản đồ</h2>
        
        <div class="tool-group">
            <label>Lớp ranh giới bản đồ</label>
            <select id="layerSelect">
                <option value="prov">Cấp Tỉnh / Thành Phố</option>
                <option value="dist">Cấp Quận / Huyện</option>
            </select>
        </div>

        <div class="tool-group">
            <label>Công cụ tương tác (Thủ công)</label>
            <select id="actionSelect">
                <option value="color">🖌️ Tô màu vùng & Ranh giới</option>
                <option value="kc">📍 Ghim Key Customer</option>
                <option value="npp">⭐ Ghim Distributor (NPP)</option>
            </select>
        </div>

        <div class="tool-group" id="colorPickerGroup">
            <label>Chọn màu (Tô vùng)</label>
            <input type="color" id="fillColor" value="#3b82f6">
        </div>
        
        <div class="tool-group" id="borderColorPickerGroup">
            <label>Chọn màu (Đường ranh giới)</label>
            <input type="color" id="borderColorInput" value="#64748b">
        </div>

        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <div class="tool-group">
            <label>Tô màu Tự Động bằng Excel</label>
            <div class="excel-upload-wrapper">
                <label for="excelFile">Tải lên file Excel (.xlsx)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
                <div class="excel-note">
                    Cột C: Tỉnh/TP/Huyện | Cột D: Loại<br>
                    (Distributor -> #002561 | Key customer -> #ea7f1a)
                </div>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <div class="tool-group">
            <label>Xuất bản đồ thành hình ảnh</label>
            <button class="export-btn" id="exportBtn">📸 Xuất ảnh Siêu Nét (5x Ultra-HD)</button>
        </div>

        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <div class="toggle-row">
            <span>Hiện nhãn Tỉnh/TP (GID_0)</span>
            <label class="switch"><input type="checkbox" id="toggleLabelProv"><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
            <span>Hiện nhãn Quận/Huyện (NAME_1)</span>
            <label class="switch"><input type="checkbox" id="toggleLabelDist"><span class="slider"></span></label>
        </div>
        
        <div id="loader">Đang tải dữ liệu bản đồ...</div>
    </div>

    <script>
        // Cấu hình tăng giảm mượt mà (0.25 bước nhảy)
        const map = L.map('map', { 
            zoomControl: false, 
            preferCanvas: true,
            zoomSnap: 0.25,  
            zoomDelta: 0.25  
        }).setView([16.047, 105.804], 6);
        
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        const layerSelect = document.getElementById('layerSelect');
        const actionSelect = document.getElementById('actionSelect');
        const colorPickerGroup = document.getElementById('colorPickerGroup');
        const borderColorPickerGroup = document.getElementById('borderColorPickerGroup');
        const fillColor = document.getElementById('fillColor');
        const borderColorInput = document.getElementById('borderColorInput');
        const toggleLabelProv = document.getElementById('toggleLabelProv');
        const toggleLabelDist = document.getElementById('toggleLabelDist');
        const excelFile = document.getElementById('excelFile');
        const exportBtn = document.getElementById('exportBtn');
        const loader = document.getElementById('loader');

        let currentGeoLayer = null;
        let markersLayer = L.layerGroup().addTo(map); 

        let currentFillColor = fillColor.value;
        let currentBorderColor = borderColorInput.value;

        fillColor.addEventListener('input', (e) => { currentFillColor = e.target.value; });
        borderColorInput.addEventListener('input', (e) => {
            currentBorderColor = e.target.value;
            updateMapBorderColors();
        });

        actionSelect.addEventListener('change', (e) => {
            const display = e.target.value === 'color' ? 'block' : 'none';
            colorPickerGroup.style.display = display;
            borderColorPickerGroup.style.display = display;
        });

        // HÀM HIỂN THỊ LABEL GỐC THEO YÊU CẦU: Tỉnh -> GID_0 | Huyện -> NAME_1
        function extractRegionName(feature, level) {
            const props = feature.properties;
            if (!props) return "";
            
            let name = "";
            if (level === 'prov') {
                name = props.GID_0 || props.COUNTRY || props.name || "";
            } else {
                name = props.NAME_1 || props.name || "";
            }

            if (name === "NA" || name === "NaN" || name === "null" || name === "undefined") return "";
            return name.trim();
        }

        // BỘ CHUẨN HÓA KHỚP CHỮ TUYỆT ĐỐI (Xóa gạch, khoảng trắng, dấu tiếng Việt)
        function getMatchKey(str) {
            if (!str) return "";
            let n = str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
            
            n = n.replace(/^tinh\s+/, "").replace(/^thanh pho\s+/, "").replace(/^tp\s+/, "");
            
            if (n.includes("ho chi minh") || n.includes("hcm")) n = "hochiminh";
            if (n.includes("ba ria") && n.includes("vung tau")) n = "bariavungtau";
            if (n.includes("thua thien hue")) n = "thuathienhue";
            
            return n.replace(/[^a-z0-9]/g, "");
        }

        function applyFeatureStyle(layer, isSelectedForColoring = false) {
            layer.setStyle({
                color: currentBorderColor, 
                weight: 1.5, 
                fillColor: isSelectedForColoring ? currentFillColor : (layer.options.fillColor || "#f1f5f9"),
                fillOpacity: (isSelectedForColoring || layer.options.fillColor) ? 0.8 : 0.5
            });
        }

        function setupFeature(feature, layer) {
            applyFeatureStyle(layer);
            applyLabelVisibility(feature, layer);

            layer.on('click', function(e) {
                const action = actionSelect.value;
                if (action === 'color') {
                    applyFeatureStyle(layer, true);
                    layer.options.fillColor = currentFillColor; 
                } else if (action === 'kc') {
                    let kcValue = prompt("Nhập số liệu cho Key Customer:", "10");
                    if (kcValue !== null && kcValue.trim() !== "") {
                        let note = prompt("Nhập ghi chú cho Key Customer này:", "Khách hàng VIP");
                        addKCPin(e.latlng, kcValue, note);
                    }
                } else if (action === 'npp') {
                    let note = prompt("Tên/Ghi chú cho Distributor (NPP):", "NPP Độc Quyền");
                    if (note !== null) {
                        addNPPPin(e.latlng, note);
                    }
                }
            });
        }

        function updateMapBorderColors() {
            if (currentGeoLayer) {
                currentGeoLayer.eachLayer(function(layer) {
                    if (layer.feature) layer.setStyle({ color: currentBorderColor });
                });
            }
        }

        function applyLabelVisibility(feature, layer) {
            const level = layerSelect.value;
            const regionName = extractRegionName(feature, level);
            
            layer.unbindTooltip();

            if ((level === 'prov' && toggleLabelProv.checked) || (level === 'dist' && toggleLabelDist.checked)) {
                if (regionName) {
                    let offset = [0, 0];
                    if (level === 'prov') {
                        let checkName = regionName.toLowerCase();
                        if (checkName.includes("kien giang") || checkName.includes("kien giang")) offset = [40, -30];   
                        else if (checkName.includes("hai phong") || checkName.includes("hai phong")) offset = [-35, -15]; 
                        else if (checkName.includes("quang ninh") || checkName.includes("quang ninh")) offset = [-20, -5]; 
                    }

                    layer.bindTooltip(regionName, { 
                        permanent: true, 
                        direction: 'center', 
                        className: 'map-label',
                        offset: offset
                    });
                }
            }
        }

        function refreshLabels() {
            if (currentGeoLayer) {
                currentGeoLayer.eachLayer(function(layer) {
                    if (layer.feature) applyLabelVisibility(layer.feature, layer);
                });
            }
        }

        toggleLabelProv.addEventListener('change', refreshLabels);
        toggleLabelDist.addEventListener('change', refreshLabels);

        function loadMapLayer(type) {
            if (currentGeoLayer) map.removeLayer(currentGeoLayer);
            loader.style.display = 'block';

            if (type === 'prov') {
                currentGeoLayer = omnivore.kml('gadm41_VNM_1.kml')
                    .on('ready', function() {
                        this.eachLayer(function(layer) { setupFeature(layer.feature, layer); });
                        loader.style.display = 'none';
                        updateMapBorderColors();
                        refreshLabels();
                    })
                    .on('error', function() {
                        alert('Không tìm thấy gadm41_VNM_1.kml. Vui lòng đảm bảo file nằm cùng thư mục.');
                        loader.style.display = 'none';
                    })
                    .addTo(map);
            } else {
                fetch('gadm41_VNM_2.json')
                    .then(res => res.json())
                    .then(data => {
                        currentGeoLayer = L.geoJSON(data, { onEachFeature: setupFeature }).addTo(map);
                        loader.style.display = 'none';
                        updateMapBorderColors();
                        refreshLabels();
                    })
                    .catch(err => {
                        alert('Không tìm thấy gadm41_VNM_2.json. Vui lòng đảm bảo file nằm cùng thư mục.');
                        loader.style.display = 'none';
                    });
            }
        }

        // --- ĐỌC FILE EXCEL & QUÉT ĐA TẦNG (FIX TRIỆT ĐỂ 100%) ---
        excelFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            loader.innerText = 'Đang xử lý file Excel...';

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                
                // Trả về mảng index thuần để chống dồn dòng trống
                const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1}); 

                let colorMapping = {}; 

                for (let i = 1; i < rows.length; i++) {
                    let row = rows[i];
                    if(!row) continue;
                    let provCell = row[2]; // Cột C (Index 2)
                    let typeCell = row[3]; // Cột D (Index 3)

                    if (provCell && typeCell) {
                        let matchKey = getMatchKey(provCell);
                        let typeStr = typeCell.toString().toLowerCase().replace(/[\s_\-\.]/g, '');
                        
                        if (typeStr.includes("distributor") || typeStr.includes("npp") || typeStr.includes("nhaphanphoi")) {
                            colorMapping[matchKey] = "#002561"; // Xanh Coban Sậm
                        } 
                        else if (typeStr.includes("keycustomer") || typeStr.includes("kc") || typeStr.includes("khachhang")) {
                            colorMapping[matchKey] = "#ea7f1a"; // Cam rực
                        }
                    }
                }

                if (currentGeoLayer) {
                    let matchCount = 0;
                    const level = layerSelect.value;
                    
                    currentGeoLayer.eachLayer(function(layer) {
                        if (layer.feature && layer.feature.properties) {
                            const props = layer.feature.properties;
                            
                            // Thuật toán quét đa tầng: Gom tất cả từ khóa có thể có để đối chiếu chống sai sót file nền
                            let possibleKeys = [];
                            if (level === 'prov') {
                                if (props.GID_0) possibleKeys.push(getMatchKey(props.GID_0));
                                if (props.COUNTRY) possibleKeys.push(getMatchKey(props.COUNTRY));
                                if (props.NAME_1) possibleKeys.push(getMatchKey(props.NAME_1));
                                if (props.name) possibleKeys.push(getMatchKey(props.name));
                            } else {
                                if (props.NAME_1) possibleKeys.push(getMatchKey(props.NAME_1)); // Tên huyện
                                if (props.COUNTRY) possibleKeys.push(getMatchKey(props.COUNTRY)); // Tên tỉnh bọc ngoài của huyện
                                if (props.GID_0) possibleKeys.push(getMatchKey(props.GID_0));
                                if (props.name) possibleKeys.push(getMatchKey(props.name));
                            }

                            // Kiểm tra xem có từ khóa nào trùng với danh sách Excel không
                            let finalColor = null;
                            for (let key of possibleKeys) {
                                if (colorMapping[key]) {
                                    finalColor = colorMapping[key];
                                    break;
                                }
                            }

                            if (finalColor) {
                                layer.options.fillColor = finalColor;
                                layer.setStyle({
                                    fillColor: finalColor,
                                    fillOpacity: 0.8
                                });
                                matchCount++;
                            }
                        }
                    });
                    alert(`Đã hoàn tất tô màu tự động! Khớp thành công ${matchCount} vùng.`);
                }
                loader.style.display = 'none';
                excelFile.value = ""; 
            };
            reader.readAsArrayBuffer(file);
        });

        // --- XUẤT HÌNH ẢNH SIÊU NÉT ---
        exportBtn.addEventListener('click', function() {
            loader.style.display = 'block';
            loader.innerText = 'Đang tối ưu hóa kích thước chữ/ghim và kết xuất hình ảnh 5x Ultra-HD...';

            const mapContainer = document.getElementById('map');
            document.body.classList.add('exporting');

            setTimeout(() => {
                html2canvas(mapContainer, {
                    useCORS: true,
                    scale: 5, 
                    logging: false,
                    backgroundColor: '#ffffff'
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'ban_do_viet_nam_ultra_hd_' + Date.now() + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    document.body.classList.remove('exporting');
                    loader.style.display = 'none';
                }).catch(err => {
                    alert('Có lỗi xảy ra khi kết xuất ảnh: ' + err);
                    document.body.classList.remove('exporting');
                    loader.style.display = 'none';
                });
            }, 300);
        });

        // Xóa ghim
        window.deleteMarker = function(markerId) {
            markersLayer.eachLayer(layer => {
                if (layer.options.customId === markerId) markersLayer.removeLayer(layer);
            });
        };

        function addKCPin(latlng, value, note) {
            let uniqueId = Date.now();
            let icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="kc-pin">${value}</div>`,
                iconSize: [28, 28], iconAnchor: [14, 14]
            });
            let marker = L.marker(latlng, { icon: icon, customId: uniqueId }).addTo(markersLayer);
            marker.bindPopup(`
                <div style="text-align: center; min-width: 120px;">
                    <b style="color: #0047ab; font-size: 13px;">Key Customer (${value})</b><br>
                    <span style="color: #475569; font-size: 12px;">${note || ''}</span>
                    <button class="delete-btn" onclick="deleteMarker(${uniqueId})">🗑️ Xóa ghim này</button>
                </div>
            `);
        }

        function addNPPPin(latlng, note) {
            let uniqueId = Date.now();
            let icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="npp-pin">⭐</div>`,
                iconSize: [30, 30], iconAnchor: [15, 15]
            });
            let marker = L.marker(latlng, { icon: icon, customId: uniqueId }).addTo(markersLayer);
            marker.bindPopup(`
                <div style="text-align: center; min-width: 120px;">
                    <b style="color: #ea580c; font-size: 13px;">Nhà Phân Phối</b><br>
                    <span style="color: #475569; font-size: 12px;">${note || ''}</span>
                    <button class="delete-btn" onclick="deleteMarker(${uniqueId})">🗑️ Xóa ghim này</button>
                </div>
            `);
        }

        map.on('click', function(e) {
            const action = actionSelect.value;
            if (action === 'kc') {
                let kcValue = prompt("Nhập số liệu Key Customer:", "10");
                if (kcValue) addKCPin(e.latlng, kcValue, prompt("Ghi chú:", "VIP"));
            } else if (action === 'npp') {
                let note = prompt("Ghi chú NPP:", "NPP Độc Quyền");
                if (note) addNPPPin(e.latlng, note);
            }
        });

        layerSelect.addEventListener('change', (e) => loadMapLayer(e.target.value));
        loadMapLayer('prov');

    </script>
</body>
</html>
