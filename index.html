<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Ranh giới Hành chính Việt Nam</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Thiết lập bản đồ hiển thị tràn toàn màn hình */
        #map {
            height: 100%;
            width: 100%;
        }
        /* Tùy chỉnh giao diện hộp thông tin nhỏ khi click */
        .leaflet-popup-content {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Khởi tạo bản đồ và đặt góc nhìn ban đầu (Tâm ở Việt Nam)
        const map = L.map('map').setView([16.047, 105.804], 6);

        // Thêm một lớp bản đồ nền từ OpenStreetMap (Bản đồ đường phố miễn phí)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Định hình màu sắc mặc định cho các đường ranh giới huyện/quận
        const myStyle = {
            color: "#ff3333",       // Màu của đường viền ranh giới
            weight: 1.5,            // Độ dày của đường viền
            opacity: 0.7,           // Độ đậm nhạt đường viền
            fillColor: "#ff9999",   // Màu nền bên trong quận/huyện
            fillOpacity: 0.15       // Độ mờ của màu nền
        };

        let geoJsonLayer;

        // Hàm xử lý sự kiện tương tác cho từng quận/huyện
        function onEachFeature(feature, layer) {
            // Kiểm tra thuộc tính của đối tượng và tạo Popup thông tin
            if (feature.properties) {
                let province = feature.properties.COUNTRY || "Chưa rõ";
                let district = feature.properties.NAME_1 || "Chưa rõ";
                
                let popupContent = `
                    <strong>Tỉnh/Thành:</strong> ${province}<br/>
                    <strong>Quận/Huyện:</strong> ${district}
                `;
                layer.bindPopup(popupContent);
            }

            // Hiệu ứng đổi màu nổi bật khi người dùng rê chuột (hover) vào vùng đất
            layer.on({
                mouseover: function (e) {
                    let hoveredLayer = e.target;
                    hoveredLayer.setStyle({
                        weight: 3,
                        color: '#0066ff',
                        fillOpacity: 0.4
                    });
                    hoveredLayer.bringToFront();
                },
                mouseout: function (e) {
                    geoJsonLayer.resetStyle(e.target); // Trả lại màu cũ khi rê chuột ra ngoài
                }
            });
        }

        // 5. Đọc dữ liệu từ file JSON hành chính bạn cung cấp
        fetch('gadm41_VNM_2.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Không thể tải tập tin dữ liệu bản đồ GeoJSON.");
                }
                return response.json();
            })
            .then(geojsonData => {
                // Tạo lớp bản đồ từ dữ liệu GeoJSON và áp dụng các hàm xử lý tương tác
                geoJsonLayer = L.geoJSON(geojsonData, {
                    style: myStyle,
                    onEachFeature: onEachFeature
                }).addTo(map);

                // Tự động thu phóng bản đồ để hiển thị vừa vặn toàn bộ ranh giới dữ liệu vừa tải
                map.fitBounds(geoJsonLayer.getBounds());
            })
            .catch(error => {
                console.error('Lỗi khi tải hoặc xử lý bản đồ:', error);
                alert('Có lỗi xảy ra khi tải dữ liệu bản đồ. Vui lòng kiểm tra lại console của trình duyệt.');
            });
    </script>
</body>
</html>
