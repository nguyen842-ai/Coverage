<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bản đồ Việt Nam - Tối giản</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }

        .dashboard-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* CỘT TRÁI: BẢN ĐỒ */
        #map {
            width: 65%;
            height: 100%;
            background-color: #ffffff !important;
        }

        /* CỘT PHẢI: TIÊU ĐỀ VÀ BỘ LỌC */
        #sidebar-right {
            width: 35%;
            background: #ffffff;
            border-left: 1px solid #e2e8f0;
            padding: 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 999;
        }

        #sidebar-right h1 {
            font-size: 20px;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            line-height: 1.4;
        }

        #sidebar-right p {
            font-size: 13px;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #334155;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-group select:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        #loader {
            font-size: 13px;
            color: #3b82f6;
            font-weight: 500;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        
        <div id="map"></div>

        <div id="sidebar-right">
            <h1>Bản đồ Hành chính Việt Nam</h1>
            <p>Hệ thống hiển thị ranh giới và bộ lọc dữ liệu địa lý tương tác.</p>
            
            <div class="filter-group">
                <label for="provinceSelect">Tỉnh / Thành phố</label>
                <select id="provinceSelect">
                    <option value="">-- Tất cả Tỉnh/Thành --</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="districtSelect">Quận / Huyện</label>
                <select id="districtSelect" disabled>
                    <option value="">-- Tất cả Quận/Huyện --</option>
                </select>
            </div>

            <div id="loader">Đang khởi tạo dữ liệu bản đồ...</div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map', { 
            attributionControl: false,
            zoomControl: true 
        }).setView([16.047, 105.804], 6);

        map.zoomControl.setPosition('topleft');

        const PROP_PROVINCE = 'COUNTRY'; 
        const PROP_DISTRICT = 'NAME_1';  

        // ĐỔI MÀU ĐƯỜNG VIỀN SANG ĐẬM HƠN (Dùng màu Slate-500 #64748b thay vì #cbd5e1)
        const defaultStyle = {
            color: "#64748b",       
            weight: 1.0,            // Tăng độ dày viền lên một chút để rõ ràng hơn
            fillColor: "#f1f5f9",   
            fillOpacity: 1          
        };

        let originalGeoData = null; 
        let currentMapLayer = null; 
        let redDotMarker = null;    // Biến lưu trữ điểm chấm đỏ toàn cục

        const provinceSelect = document.getElementById('provinceSelect');
        const districtSelect = document.getElementById('districtSelect');
        const loader = document.getElementById('loader');

        fetch('gadm41_VNM_2.json')
            .then(res => res.json())
            .then(data => {
                originalGeoData = data;
                loader.style.display = 'none'; 

                renderMap(originalGeoData.features, true); // Lần đầu load thì scale tự động
                populateProvinces(originalGeoData.features);
            })
            .catch(err => {
                loader.innerText = "Lỗi tải dữ liệu JSON.";
                console.error(err);
            });

        function renderMap(features, shouldFitBounds = false) {
            if (currentMapLayer) {
                map.removeLayer(currentMapLayer); 
            }

            currentMapLayer = L.geoJSON({ type: "FeatureCollection", features: features }, {
                style: defaultStyle,
                onEachFeature: function(feature, layer) {
                    let prov = feature.properties[PROP_PROVINCE] || "Chưa rõ";
                    let dist = feature.properties[PROP_DISTRICT] || "Chưa rõ";
                    
                    layer.bindPopup(`
                        <strong style="font-size:14px;">${dist}</strong><br>
                        <span style="color:#64748b; font-size:12px;">Thuộc: ${prov}</span>
                    `);

                    layer.on({
                        mouseover: (e) => {
                            e.target.setStyle({ 
                                weight: 1.8, 
                                color: '#3b82f6', 
                                fillColor: '#e0f2fe' 
                            });
                        },
                        mouseout: (e) => { 
                            currentMapLayer.resetStyle(e.target); 
                        }
                    });
                }
            }).addTo(map);

            if (shouldFitBounds) {
                map.fitBounds(currentMapLayer.getBounds(), { padding: [20, 20] });
            }
        }

        function populateProvinces(features) {
            const provinces = [...new Set(features.map(f => f.properties[PROP_PROVINCE]))].sort();
            provinces.forEach(prov => {
                if(prov) {
                    let opt = document.createElement('option');
                    opt.value = prov;
                    opt.textContent = prov;
                    provinceSelect.appendChild(opt);
                }
            });
        }

        // SỰ KIỆN LỌC TỈNH / THÀNH PHỐ
        provinceSelect.addEventListener('change', function() {
            const selectedProvince = this.value;
            districtSelect.innerHTML = '<option value="">-- Tất cả Quận/Huyện --</option>';
            
            // Xóa chấm đỏ cũ nếu có trước khi thực hiện lọc mới
            if (redDotMarker) {
                map.removeLayer(redDotMarker);
                redDotMarker = null;
            }
            
            if (!selectedProvince) {
                renderMap(originalGeoData.features, true);
                districtSelect.disabled = true;
                return;
            }

            const filteredFeatures = originalGeoData.features.filter(f => f.properties[PROP_PROVINCE] === selectedProvince);
            
            // Vẽ các quận/huyện của tỉnh đó lên (nhưng chưa fitBounds vội để tạo hiệu ứng)
            renderMap(filteredFeatures, false);
            
            // 1. Lấy tọa độ trung tâm của tỉnh vừa lọc
            const bounds = currentMapLayer.getBounds();
            const centerLatLng = bounds.getCenter();

            // 2. Tạo chấm điểm đỏ viền trắng tương phản cao tại tâm của Tỉnh
            redDotMarker = L.circleMarker(centerLatLng, {
                radius: 8,             // Kích thước điểm tròn
                color: '#ffffff',      // Viền trắng bên ngoài giúp nổi bật trên mọi nền màu
                weight: 2,             // Độ dày viền trắng
                fillColor: '#ef4444',  // Màu đỏ rực rỡ (đỏ tươi)
                fillOpacity: 1
            }).addTo(map);

            // 3. Tiến hành Scale (Zoom mượt mà) vào khu vực Tỉnh đó sau khi chấm điểm
            map.fitBounds(bounds, {
                padding: [50, 50],     // Khoảng cách an toàn với mép màn hình
                animate: true,         // Bật hiệu ứng chuyển động mượt mà
                duration: 1.2          // Thời gian thực hiện hiệu ứng zoom (1.2 giây)
            });
            
            // Cập nhật danh sách quận/huyện vào ô chọn
            const districts = [...new Set(filteredFeatures.map(f => f.properties[PROP_DISTRICT]))].sort();
            districts.forEach(dist => {
                if(dist) {
                    let opt = document.createElement('option');
                    opt.value = dist;
                    opt.textContent = dist;
                    districtSelect.appendChild(opt);
                }
            });
            districtSelect.disabled = false;
        });

        // SỰ KIỆN LỌC QUẬN / HUYỆN
        districtSelect.addEventListener('change', function() {
            const selectedProvince = provinceSelect.value;
            const selectedDistrict = this.value;

            // Mỗi khi chuyển sang lọc chi tiết huyện, tạm ẩn chấm đỏ của Tỉnh đi cho đỡ rối mắt
            if (redDotMarker) {
                map.removeLayer(redDotMarker);
                redDotMarker = null;
            }

            if (!selectedDistrict) {
                const filteredFeatures = originalGeoData.features.filter(f => f.properties[PROP_PROVINCE] === selectedProvince);
                renderMap(filteredFeatures, false);
                
                // Vẽ lại chấm đỏ ở tâm tỉnh nếu người dùng chọn về "Tất cả Quận/Huyện"
                const bounds = currentMapLayer.getBounds();
                redDotMarker = L.circleMarker(bounds.getCenter(), {
                    radius: 8, color: '#ffffff', weight: 2, fillColor: '#ef4444', fillOpacity: 1
                }).addTo(map);
                
                map.fitBounds(bounds, { padding: [50, 50], animate: true, duration: 1 });
                return;
            }

            const finalFeatures = originalGeoData.features.filter(f => 
                f.properties[PROP_PROVINCE] === selectedProvince && 
                f.properties[PROP_DISTRICT] === selectedDistrict
            );
            
            renderMap(finalFeatures, true); // Phóng thẳng vào ranh giới Quận/Huyện cụ thể
        });
    </script>
</body>
</html>
